name: Finalize Roundtable A1 copy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-roundtable-a1.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct public authority and evidence language
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('App.tsx')
          s = p.read_text()
          replacements = {
            'Most Popular': 'Managed Session',
            "{isPro ? 'Upgrade to Elite' : 'Choose Community'}": "{isPro ? 'Use Managed Session' : 'Use Own Key'}",
            '{ title: "Panel Assembly", desc: "Summoning 14 interdisciplinary specialists...", icon: Users, color: "text-indigo-500", bg: "bg-indigo-50" }': '{ title: "Lens Setup", desc: "Preparing 14 disciplinary reasoning lenses...", icon: Users, color: "text-indigo-500", bg: "bg-indigo-50" }',
            '{ title: "Strategic Debate", desc: "Simulating intellectual friction and synthesis...", icon: BarChart3, color: "text-indigo-500", bg: "bg-indigo-50" }': '{ title: "Cross-Lens Comparison", desc: "Comparing agreements, conflicts, assumptions, and missing evidence...", icon: BarChart3, color: "text-indigo-500", bg: "bg-indigo-50" }',
            '{ title: "Final Verdict", desc: "Constructing multi-layer ethical & economic conclusion...", icon: Scale, color: "text-indigo-500", bg: "bg-indigo-50" }': '{ title: "Synthesis", desc: "Producing a structured synthesis with uncertainty and failure conditions...", icon: Scale, color: "text-indigo-500", bg: "bg-indigo-50" }',
            'Experts to Include': 'Lenses to Include',
            "{ key: 'includeDebate', label: 'Strategic Debate' }": "{ key: 'includeDebate', label: 'Cross-Lens Comparison' }",
            "{ key: 'includeAgreements', label: 'Consensus Agreements' }": "{ key: 'includeAgreements', label: 'Agreements' }",
            "{ key: 'includeVerdict', label: 'Final Multi-layer Verdict' }": "{ key: 'includeVerdict', label: 'Final Synthesis' }",
            'Download customized dossier': 'Download report',
            'Unlock Full Engine': 'Use Managed Session',
            'The Gold Standard in Interdisciplinary AI': 'Fourteen disciplinary lenses, one traceable synthesis',
            'Elite Interdisciplinary <br />': 'Interdisciplinary <br />',
            '<span className="text-indigo-600">Reasoning Engine</span>': '<span className="text-indigo-600">Reasoning Interface</span>',
            'Submit complex problems to a closed-room roundtable of 14 elite academic experts from different fields (': 'Submit one problem to fourteen disciplinary software reasoning lenses (',
            '). Get rigorous analysis, interdisciplinary debate, and a definitive structured verdict.': '). Compare their analyses, disagreements, assumptions, uncertainty, and failure conditions before the model produces a structured synthesis.',
            'Access Tiers': 'Session Options',
            'View Premium Sample': 'View Sample',
            "{isFreeMode ? 'Community Session Active' : 'Elite Managed:'}": "{isFreeMode ? 'Own-Key Session Active' : 'Managed Session:'}",
            "{isFreeMode ? ' Optimized community analysis' : ' Optimized academic ensemble'}": "{isFreeMode ? ' OpenRouter key supplied by you' : ' Server-side OpenRouter session'}",
            'title="14 Expert Lenses"': 'title="14 Disciplinary Lenses"',
            'description="From Physics to Ethics, our engine simulates a diverse panel of specialists for true 360° reasoning."': 'description="The same question is analyzed through fourteen named disciplinary software roles before comparison and synthesis."',
            'title="Rigorous Evidence"': 'title="Evidence Labels"',
            'description="Every claim is tagged by evidence strength: Established Fact, Strong Evidence, or Theoretical."': 'description="The model labels claims by evidence category. Material claims still require verification against traceable sources."',
            'title="Interdisciplinary Debate"': 'title="Cross-Lens Comparison"',
            'description="Experts don\'t just talk; they debate. We identify conflicts and resolve them through logic."': 'description="The comparison stage records agreements, conflicts, incompatible assumptions, and unresolved uncertainty."',
            'A structured workflow inspired by elite academic research panels.': 'Each lens is a software reasoning role. No human academic panel or peer review is implied.',
            '{ step: "02", title: "Analysis", desc: "14 experts evaluate independently in their domains." }': '{ step: "02", title: "Analysis", desc: "14 disciplinary lenses analyze independently within their assigned fields." }',
            '{ step: "03", title: "Debate", desc: "Interdisciplinary cross-examination and conflict resolution." }': '{ step: "03", title: "Compare", desc: "Compare agreements, conflicts, assumptions, and missing evidence." }',
            '{ step: "04", title: "Verdict", desc: "A final, multi-layered synthesis with confidence levels." }': '{ step: "04", title: "Synthesis", desc: "Produce a structured synthesis with uncertainty and failure conditions." }',
            'Select Your Intelligence Tier': 'Choose Session Mode',
            'Go to PAY to choose: $1 with your own API key, or $5 with our managed NVIDIA API.': 'Choose $1 with your own OpenRouter key or $5 for a managed server-side OpenRouter session.',
            'title="Community"': 'title="Own Key"',
            '"1 interdisciplinary session"': '"1 analysis session"',
            'title="Elite Roundtable"': 'title="Managed Session"',
            '"Full 14-expert panel"': '"All 14 disciplinary reasoning lenses"',
            '"Deep interdisciplinary debate"': '"Cross-lens comparison"',
            '"Professional PDF Dossier Export"': '"PDF analysis report export"',
            '"Economic & Ethical governance"': '"Economics and ethics lenses"',
            '"Confidence level metrics"': '"Model-reported confidence field"',
            'description: "Roundtable AI Elite Session Unlock"': 'description: "Roundtable AI Managed Session"',
            'Preview a High-Res Report': 'Preview Sample Report',
            'PREVIEW: Sample High-Resolution Dossier': 'PREVIEW: Sample Analysis Report',
            'Export Professional Dossier': 'Export Analysis Report',
            '© 2024 Closed Roundtable Reasoning Engine. Standardized academic knowledge only.': '© 2024 Roundtable AI. Software reasoning lenses. Verify material claims against traceable sources.',
            'Elite Managed Roundtable': 'Managed Session',
            'Deploy our optimized ensemble of 14 specialists. ($5.00/session)': 'Run the same 14 reasoning lenses using the server-side OpenRouter configuration. ($5.00/session)',
            'Private API Integration': 'Own OpenRouter Key',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          s = re.sub(r"\nconst Testimonial = \(\{ quote, author, role, avatar \}:.*?\n\);\n\nconst FAQItem", "\nconst FAQItem", s, flags=re.S)
          s = s.replace(', MessageSquare,', ',')
          a = s.find('            {/* Testimonials */}')
          b = s.find('            {/* FAQ */}')
          if a == -1 or b == -1 or a >= b:
              raise SystemExit('testimonial section markers not found')
          boundary = '''            {/* Interpretation boundary */}\n            <div className="mb-24 max-w-4xl mx-auto border-y border-slate-200 py-10">\n              <h2 className="text-2xl font-bold text-slate-900 mb-4">Interpretation Boundary</h2>\n              <p className="text-slate-600 leading-relaxed">\n                The fourteen lenses are model roles, not people. Their outputs are hypotheses and analyses generated by software. Evidence labels and confidence fields are model outputs, not independent verification. Material claims should be checked against traceable primary literature, official documentation, or qualified human review.\n              </p>\n            </div>\n\n'''
          s = s[:a] + boundary + s[b:]
          s = s.replace('question="How does the 14-expert simulation work?"', 'question="What are the 14 disciplinary lenses?"')
          s = s.replace('answer="We use advanced prompt engineering and multi-persona modeling to ensure each expert reasons strictly within their defined academic domain, preventing cross-contamination of logic until the debate phase."', 'answer="They are software reasoning roles assigned to named disciplines. They are not human experts, peer reviewers, clinicians, or professional authorities. Their outputs can be wrong and should be verified when the stakes matter."')
          s = s.replace('answer="Yes, all payments are processed through Stripe, the industry standard for secure online transactions. We never store your credit card information."', 'answer="Payments in this interface are processed through PayPal. The application does not directly collect card details."')
          s = s.replace('answer="It excels at complex, multi-faceted problems where technical, ethical, and economic factors collide—such as policy decisions, product strategy, or philosophical puzzles."', 'answer="It is designed for questions that benefit from comparing technical, ethical, economic, scientific, and social frames. The synthesis is model-generated and should not replace qualified advice or source verification."')
          prohibited = ['elite academic experts','definitive structured verdict','Gold Standard','Full 14-expert panel','Trusted by Strategic Thinkers','simulates a diverse panel of specialists','Experts don\'t just talk','optimized academic ensemble','processed through Stripe']
          bad = [x for x in prohibited if x.lower() in s.lower()]
          if bad:
              raise SystemExit('prohibited public copy remains: ' + ', '.join(bad))
          p.write_text(s)
      - name: Commit corrected App copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Correct Roundtable public authority and evidence claims"
          git push
